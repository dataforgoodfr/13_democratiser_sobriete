[project]
name = "pi-recluster"
version = "0.1.0"
description = "Stratified re-clustering pipeline for the sufficiency policy library, packaged to run on a rented CPU box."
# Upper-bound on Python: several deps (psycopg2-binary transitively via
# codecarbon, plus older faiss/torch wheels) don't have 3.13/3.14 wheels
# and fall back to source builds that need system libs.
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "huggingface_hub>=0.24",
    "hf_transfer>=0.1.6",       # 200+ MB/s downloads from HF
    "faiss-cpu>=1.8",           # k-NN graph construction
    "igraph>=0.11",             # graph backend for Leiden
    "leidenalg>=0.10",          # Leiden community detection
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "openai>=1.30",             # only needed if you run the classifier from the box
    # codecarbon 3.x pulls Postgres via fief-client for its SaaS backend, which
    # requires libpq-dev + pg_config on the host. Pin to 2.x for a slim install.
    "codecarbon>=2.5,<3.0",
]

[project.optional-dependencies]
# Install only on the GPU box: `uv sync --extra gpu`
# vLLM pulls in torch + CUDA and won't install on CPU-only boxes.
gpu = [
    "vllm>=0.6.4",              # offline batch inference, guided JSON, prefix caching
    "xgrammar>=0.1.5",           # backend for guided_decoding
]

[tool.uv]
package = false

[project]
name = "policy-analysis-workspace"
version = "0.1.0"
description = "Agentic RAG + policy analysis pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.1",
    # Clustering evaluation harness (policy_analysis/clustering/eval).
    # Run with: uv run python -m policy_analysis.clustering.eval.run --help
    "openai>=2.12.0",
    "pandas>=2.2.3",
    "pyarrow>=19.0.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.34.0",
    "openpyxl>=3.1.0",
]

# Workspace project — not built/installed as a package. We use this pyproject
# only to declare the deps that "uv run" should make available in the env.
[tool.uv]
package = false

# We need to decide if we want use workspace or not
# Because this file will not be used in submodules if don't set the workspace properly

# [tool.uv.workspace]
# members = [
#     "policy_analysis",
#     "library",
# ]

[tool.ruff]
# Same as Black.
line-length = 96
target-version = "py312"

# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.mccabe]
max-complexity = 10
